id = "dev-town.harbr"
name = "Harbr"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Open Harbr as a Herdr workspace popup"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open Harbr"
contexts = ["workspace"]
command = ["sh", "scripts/open.sh"]

[[panes]]
id = "main"
title = "Harbr"
placement = "popup"
width = "80%"
height = "60%"
command = ["harbr"]
