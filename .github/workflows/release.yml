name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release archives
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --os '*' --cpu '*'

      - name: Verify tag matches package version
        id: version
        run: |
          version="$(bun -e "console.log((await Bun.file('apps/tui/package.json').json()).version)")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable SemVer tags (vMAJOR.MINOR.PATCH) are supported." >&2
            exit 1
          fi

          if [ "$version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: bun run check

      - name: Package release artifacts
        run: bun run package:release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harbr-release
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            dist/release/manifest.json
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: harbr-release
          path: dist/release

      - name: Install and run release binary
        run: sh scripts/smoke-release.sh "${{ needs.build.outputs.version }}"

  release:
    name: Publish release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: harbr-release
          path: dist/release

      - name: Require Homebrew tap token
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish a stable release." >&2
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: dev-town/homebrew-tap
          path: homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew formula
        run: |
          bun scripts/update-homebrew-formula.ts \
            --formula homebrew-tap/Formula/harbr.rb \
            --manifest dist/release/manifest.json

      - name: Prepare release notes
        run: |
          awk -v heading="## ${{ needs.build.outputs.version }}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' apps/tui/CHANGELOG.md > dist/release/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release/release-notes.md; then
            echo "No changelog entry for ${{ needs.build.outputs.version }}." >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/release/*.tar.gz \
              dist/release/SHA256SUMS \
              dist/release/manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file dist/release/release-notes.md \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/release/*.tar.gz \
              dist/release/SHA256SUMS \
              dist/release/manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "harbr $GITHUB_REF_NAME" \
              --notes-file dist/release/release-notes.md \
              --latest
          fi

      - name: Commit Homebrew formula
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/harbr.rb; then
            echo "Homebrew formula already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/harbr.rb
          git commit -m "Update harbr to $GITHUB_REF_NAME"
          git push
